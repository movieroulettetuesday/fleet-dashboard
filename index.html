function u(s){var b=atob(s),a=new Uint8Array(b.length);for(var j=0;j<b.length;j++)a[j]=b.charCodeAt(j);return a;}
var $=function(id){return document.getElementById(id);};
function store(){try{return window.localStorage;}catch(e){return null;}}
async function unlock(pw){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:u(P.s),iterations:P.it},base,{name:"AES-GCM",length:256},false,["decrypt"]);

function show(html){document.open();document.write(html);document.close();}
async function attempt(pw,remember,auto){
