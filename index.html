var K="fleetDashPw";
function u(s){var b=atob(s),a=new Uint8Array(b.length);for(var j=0;j<b.length;j++)a[j]=b.charCodeAt(j);return a;}
var $=function(id){return document.getElementById(id);};
function store(){try{return window.localStorage;}catch(e){return null;}}
async function unlock(pw){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:u(P.s),iterations:P.it},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(P.i)},key,u(P.c));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
async function attempt(pw,remember,auto){
  $("go").disabled=true;$("err").textContent="Unlocking…";
  try{
    var html=await unlock(pw);
    var ls=store();
    if(ls){if(remember)ls.setItem(K,pw);else if(!auto)ls.removeItem(K);}
    show(html);
  }catch(e){
    $("go").disabled=false;
    if(!window.crypto||!crypto.subtle){$("err").textContent="This browser cannot decrypt (needs HTTPS + WebCrypto).";return;}
    if(auto){var ls2=store();if(ls2)ls2.removeItem(K);$("err").textContent="Saved password no longer works. Enter it again.";}
    else $("err").textContent="Wrong password.";
    $("pw").value="";$("pw").focus();
  }
}
$("f").addEventListener("submit",function(e){e.preventDefault();var v=$("pw").value;if(v)attempt(v,$("rem").checked,false);});
